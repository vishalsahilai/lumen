<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen — AI Learning Ecosystem (Prototype)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#070d1f;--p:#0c1630;--p2:#111d3d;--b:#1e2d55;--t:#eaf0ff;--m:#8fa0c8;--c:#22d3ee;--c2:#3b82f6;--ok:#34d399;--w:#fbbf24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--t);font:14px/1.5 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
#app{display:flex;min-height:100vh}
aside{width:230px;background:var(--p);border-right:1px solid var(--b);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto;flex:none;transition:width .2s}
aside.col{width:64px}aside.col .l{display:none}
.logo{display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px;padding:4px 8px 16px}
.dot{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--c),var(--c2));flex:none}
.nav{display:flex;gap:10px;align-items:center;width:100%;background:none;border:0;padding:9px 10px;border-radius:9px;color:var(--m);text-align:left}
.nav:hover{background:var(--p2);color:var(--t)}.nav.on{background:var(--p2);color:var(--c);box-shadow:inset 2px 0 var(--c)}
.nav i{width:18px;text-align:center;font-style:normal}
main{flex:1;min-width:0}
header{display:flex;gap:10px;align-items:center;padding:12px 22px;border-bottom:1px solid var(--b);position:sticky;top:0;background:rgba(7,13,31,.92);backdrop-filter:blur(8px);z-index:5;flex-wrap:wrap}
header input,header select{background:var(--p);border:1px solid var(--b);border-radius:9px;padding:7px 10px}
header input{flex:1;min-width:120px;max-width:320px}
.pill{background:var(--p2);border:1px solid var(--b);border-radius:99px;padding:4px 12px;font-size:12px;color:var(--c)}
.ic{background:var(--p);border:1px solid var(--b);border-radius:9px;padding:7px 11px}
#ham{display:none}
.pg{padding:24px 22px;max-width:1240px}
h1{font-size:26px;letter-spacing:-.02em}h2{font-size:17px;margin-bottom:12px}h3{font-size:15px}
.sub{color:var(--m);margin:4px 0 20px}
.g{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}.g5{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{background:var(--p);border:1px solid var(--b);border-radius:14px;padding:16px}
.card.h:hover{border-color:var(--c2);cursor:pointer}
.big{font-size:26px;font-weight:700}.mu{color:var(--m);font-size:12.5px}
.btn{background:linear-gradient(135deg,var(--c),var(--c2));color:#04101f;border:0;border-radius:9px;padding:8px 14px;font-weight:600}
.btn.s{background:var(--p2);color:var(--t);border:1px solid var(--b)}.btn.sm{padding:5px 10px;font-size:12px}
.tag{display:inline-block;background:var(--p2);border:1px solid var(--b);color:var(--m);border-radius:99px;padding:1px 9px;font-size:11.5px;margin:2px 3px 2px 0}
.av{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:700;color:#04101f;flex:none}
.bar{height:6px;background:var(--p2);border-radius:9px;overflow:hidden;margin:8px 0}.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--c2))}
.row{display:flex;gap:12px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}
.sec{margin:26px 0 0}
.tl{border-left:2px solid var(--b);padding-left:14px;margin-left:6px}.tl div{margin-bottom:12px;position:relative}.tl div:before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--c)}
.cls{display:grid;grid-template-columns:240px 1fr 260px;gap:14px;height:calc(100vh - 150px);min-height:520px}
.cls>.card{overflow:auto}
.chat{display:flex;flex-direction:column;padding:0!important;overflow:hidden!important}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 13px;border-radius:13px;background:var(--p2)}.m.u{align-self:flex-end;background:#12356b}
.inp{display:flex;gap:8px;padding:12px;border-top:1px solid var(--b)}
.inp input,.f input,.f select,.f textarea,textarea.ed{flex:1;width:100%;background:var(--bg);border:1px solid var(--b);border-radius:9px;padding:8px 10px}
.sug{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
.ty span{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:var(--c);animation:bl 1s infinite}.ty span:nth-child(2){animation-delay:.2s}.ty span:nth-child(3){animation-delay:.4s}
@keyframes bl{50%{opacity:.2}}
.f label{display:block;font-size:12px;color:var(--m);margin:10px 0 3px}
textarea.ed{min-height:300px;font:13px/1.6 Inter,sans-serif}
.ch{cursor:pointer;user-select:none}
.tab{background:none;border:1px solid var(--b);border-radius:99px;padding:4px 12px;color:var(--m);margin:0 6px 6px 0}.tab.on{background:var(--c);color:#04101f;border-color:var(--c)}
.spk{border:1px solid var(--b);border-radius:14px;padding:12px;background:var(--p);transition:.2s}.spk.live{border-color:var(--c);box-shadow:0 0 0 3px rgba(34,211,238,.15)}
.tr{max-height:340px;overflow:auto}.tr p{margin-bottom:10px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--c);color:#04101f;padding:9px 16px;border-radius:99px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:20}#toast.on{opacity:1}
.note{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);color:var(--w);border-radius:9px;padding:6px 10px;font-size:12px;margin-bottom:14px}
.sc{overflow-x:auto}
@media(max-width:900px){aside{position:fixed;left:-250px;z-index:10;transition:left .2s;height:100%}aside.open{left:0}#ham{display:block}.cls{grid-template-columns:1fr;height:auto}.cls .chat{height:70vh}.hd{display:none}.pg{padding:18px 14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="app"><aside id="sb"></aside><main><header id="hd"></header><div class="pg" id="pg"></div></main></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const NAV=[["overview","◎","Overview"],["teachers","✦","AI Teachers"],["hub","▤","Learning Hub"],["projects","⬡","Practical Projects"],["studio","✎","Content Studio"],["podcast","◉","AI Podcast Studio"],["progress","↗","My Progress"],["career","⚑","Career & Skills"],["community","❖","Community"],["settings","⚙","Settings"]];
const T=[
["Alex Morgan","Business & Entrepreneurship","Coaches through real case studies and live market scenarios.","Case-based, Socratic","EN, ES, FR","#22d3ee","AM"],
["Professor Nova","Technology & Artificial Intelligence","Explains AI with everyday examples before any math.","Example-first, step-by-step","EN, ES, AR","#3b82f6","PN"],
["Dr. Lyra","Science & Research","Guides inquiry, experiments and evidence-based reasoning.","Inquiry-led","EN, DE","#34d399","DL"],
["Math Mentor","Mathematics & Logical Thinking","Builds intuition for proofs, patterns and problem solving.","Visual, incremental","EN, HI","#fbbf24","MM"],
["Professor Atlas","History & Civilization","Connects past events to the systems we live in today.","Narrative, comparative","EN, FR","#f472b6","PA"],
["RoboX","Robotics & Engineering","Walks through sensors, control loops and prototyping.","Hands-on, build-first","EN, ZH","#a78bfa","RX"],
["Sophia","Communication, Creativity & Future Skills","Develops storytelling, design thinking and collaboration.","Reflective, workshop style","EN, ES, PT","#fb923c","SO"]];
const LV=["Beginner","Intermediate","Advanced"];
const C=[["What is Artificial Intelligence?","Artificial Intelligence",0,"1",6,1,62],["Python for Problem Solving","Technology",0,"1",8,1,40],["Startup Fundamentals","Entrepreneurship",0,"0",5,0,85],["Scientific Method in Practice","Science",0,"2",4,2,20],["Logic & Proof Basics","Mathematics",0,"3",6,0,0],["Industrial Revolutions & Today","History",0,"4",3,1,55],["Sensors & Control Loops","Robotics",1,"5",7,1,10],["Storytelling for Impact","Communication",0,"6",4,0,0],["Machine Learning Intuition","Artificial Intelligence",1,"1",10,2,0],["Pricing & Unit Economics","Business",1,"0",5,1,0],["Prompting & AI Literacy","Future Skills",0,"6",3,0,30],["Data Analysis with Python","Technology",2,"1",9,2,0]];
const P=[["Build Your First AI Chatbot","Create a rule-based then AI-assisted FAQ bot for a small shop.",["Prompt design","Python","UX writing"],1,"6 hrs",["Define the use case","Map 10 common questions","Prototype conversation flow","Test with 3 people","Write a short reflection"],3],
["Design a Smart Home System","Plan sensors, automations and privacy for a one-room smart setup.",["IoT basics","Systems thinking"],1,"5 hrs",["List devices and sensors","Draw the system diagram","Define automation rules","Assess privacy risks"],1],
["Create a Small Business Plan","Validate an idea and model first-year costs and revenue.",["Market research","Finance"],0,"8 hrs",["Describe the customer","Size the market","Build a cost sheet","Write a one-page summary"],4],
["Build a Personal Portfolio Website","Publish a clear portfolio that shows three pieces of work.",["HTML/CSS","Design","Writing"],0,"7 hrs",["Choose three projects","Sketch the layout","Build the pages","Review and publish"],2],
["Design a Robotics Prototype","Specify a line-following robot and test its control logic in a simulator.",["Control loops","Prototyping"],2,"10 hrs",["Define requirements","Choose sensors","Write control logic","Run simulator tests"],0],
["Analyze a Real-World Science Problem","Use public data to investigate a local environmental question.",["Research","Data analysis"],2,"9 hrs",["Frame the question","Collect public data","Analyze results","Present findings"],0]];
const S=JSON.parse(localStorage.getItem("lumen")||"null")||{role:"Student",credits:742,pm:{},lib:[{id:1,t:"Intro to Neural Networks",f:"Educational lesson",st:"Published",x:"Neural networks learn patterns by adjusting weights from examples..."},{id:2,t:"Ethics of AI in Classrooms",f:"Educational article",st:"Draft",x:"Draft outline: privacy, bias, transparency."}]};
const save=()=>{try{localStorage.setItem("lumen",JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove("on"),1800)}
const av=(i,s)=>`<div class="av" style="background:${T[i][5]};${s||""}">${T[i][6]}</div>`;
const bar=p=>`<div class="bar"><b style="width:${p}%"></b></div>`;
const pdone=i=>(S.pm[i]||[]).length,ppct=i=>Math.round(100*(P[i][6]&&!S.pm[i]?P[i][6]:pdone(i))/P[i][5].length);
function pp(i){const n=P[i][5].length;const d=S.pm[i]?S.pm[i].length:P[i][6];return Math.round(100*d/n)}
function nav(){const r=location.hash.slice(1)||"overview";$("#sb").innerHTML=`<div class="logo"><div class="dot"></div><span class="l">Lumen</span></div>`+NAV.map(n=>`<button class="nav ${r.startsWith(n[0])||(n[0]=="teachers"&&r.startsWith("class"))||(n[0]=="projects"&&r.startsWith("proj"))?"on":""}" onclick="go('${n[0]}')"><i>${n[1]}</i><span class="l">${n[2]}</span></button>`).join("")+`<button class="nav" onclick="$('#sb').classList.toggle('col')"><i>⇤</i><span class="l">Collapse</span></button>`}
function go(r){location.hash=r;$("#sb").classList.remove("open")}
function head(){$("#hd").innerHTML=`<button class="ic" id="ham" onclick="$('#sb').classList.toggle('open')" aria-label="Menu">☰</button><input id="gs" placeholder="Search courses, teachers, projects" onkeydown="if(event.key=='Enter'){Q=this.value;go('hub');render()}"><span class="pill">${S.credits} AI credits</span><select onchange="S.role=this.value;save();render();toast('Demo role: '+this.value)" aria-label="Demo role">${["Student","Educator","Parent"].map(x=>`<option ${x==S.role?"selected":""}>${x}</option>`).join("")}</select><select class="hd" aria-label="Language"><option>English</option><option>Español</option><option>Français</option><option>العربية</option></select><button class="ic hd" onclick="toast('3 new: Atlas replied, project feedback, new course')">🔔</button><div class="row"><div class="av" style="width:34px;height:34px;background:var(--c)">AJ</div></div>`}
let Q="",CAT="All",LVL="All";
const pages={
overview(){if(S.role=="Educator")return educator();if(S.role=="Parent")return parent();
const st=[["Learning hours","126 h"],["Skills developing","14"],["Projects completed","3"],["Learning progress","58%"],["AI credits left",S.credits]];
const wk=[3,5,2,6,4,7,3],mx=7;
return `<h1>Good morning, Alex!</h1><p class="sub">Your next generation of learning starts here.</p>
<div class="g g5">${st.map(s=>`<div class="card"><div class="mu">${s[0]}</div><div class="big">${s[1]}</div></div>`).join("")}</div>
<div class="sec"><h2>Continue learning</h2><div class="g g2">${C.filter(c=>c[6]>0).slice(0,3).map((c,i)=>cc(C.indexOf(c))).join("")}</div></div>
<div class="sec"><h2>Your AI teachers</h2><div class="row wrap">${T.map((t,i)=>`<button class="card h row" style="padding:10px 14px" onclick="go('class-${i}')">${av(i,"width:34px;height:34px")}<span>${t[0]}</span></button>`).join("")}</div></div>
<div class="g g2 sec"><div class="card"><h2>Weekly learning activity</h2><svg viewBox="0 0 320 140" width="100%" role="img" aria-label="Hours per day">${wk.map((v,i)=>`<rect x="${i*44+8}" y="${120-v/mx*100}" width="28" height="${v/mx*100}" rx="6" fill="url(#gr)"/><text x="${i*44+22}" y="136" fill="#8fa0c8" font-size="10" text-anchor="middle">${"MTWTFSS"[i]}</text><text x="${i*44+22}" y="${114-v/mx*100}" fill="#eaf0ff" font-size="10" text-anchor="middle">${v}h</text>`).join("")}<defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient></defs></svg></div>
<div class="card"><h2>Practical learning</h2>${[0,1,3].map(i=>`<div onclick="go('proj-${i}')" style="cursor:pointer"><div class="row sp"><b>${P[i][0]}</b><span class="mu">${pp(i)}%</span></div>${bar(pp(i))}</div>`).join("")}</div></div>
<div class="sec"><h2>Recommended for you</h2><div class="g g3">${[8,6,10].map(cc).join("")}</div></div>
<div class="card sec"><h2>Your learning journey</h2><div class="tl"><div><b>Earned “Prompt Pioneer” badge</b><div class="mu">Today</div></div><div><b>Completed milestone: Map 10 common questions</b><div class="mu">2 days ago</div></div><div><b>Finished Startup Fundamentals module 4</b><div class="mu">Last week</div></div><div><b>Joined Lumen</b><div class="mu">Month 1</div></div></div></div>`},
teachers(){return `<h1>AI Teachers</h1><p class="sub">Seven specialists. Subject names are provisional and configurable.</p><div class="g g3">${T.map((t,i)=>`<div class="card"><div class="row">${av(i)}<div><h3>${t[0]}</h3><div class="mu">${t[1]}</div></div></div><p style="margin:10px 0">${t[2]}</p><div class="mu">Style: ${t[3]}</div><div class="mu">Languages: ${t[4]}</div><div style="margin:8px 0">${LV.map(l=>`<span class="tag">${l}</span>`).join("")}</div><button class="btn" onclick="go('class-${i}')">Start learning</button></div>`).join("")}</div>`},
hub(){const cats=["All",...new Set(C.map(c=>c[1]))];const list=C.map((c,i)=>i).filter(i=>(CAT=="All"||C[i][1]==CAT)&&(LVL=="All"||LV[C[i][2]]==LVL)&&C[i][0].toLowerCase().includes(Q.toLowerCase()));
return `<h1>Learning Hub</h1><p class="sub">Courses taught by AI teachers, with human educator oversight.</p><div class="row wrap f" style="margin-bottom:12px"><input style="max-width:280px" placeholder="Search courses" value="${esc(Q)}" oninput="Q=this.value;rl()"><select style="max-width:160px" onchange="LVL=this.value;render()">${["All",...LV].map(l=>`<option ${l==LVL?"selected":""}>${l}</option>`).join("")}</select></div><div>${cats.map(c=>`<button class="tab ${c==CAT?"on":""}" onclick="CAT='${c}';render()">${c}</button>`).join("")}</div><div class="g g3" id="cl">${list.map(cc).join("")||'<p class="mu">No courses match. Clear a filter to see more.</p>'}</div><div class="sec"><h2>Recently added</h2><div class="g g3">${[11,10,9].map(cc).join("")}</div></div>`},
projects(){return `<h1>Practical Projects</h1><p class="sub">Apply what you learn to real situations.</p><div class="g g3">${P.map((p,i)=>`<div class="card h" onclick="go('proj-${i}')"><h3>${p[0]}</h3><p class="mu" style="margin:6px 0">${p[1]}</p>${p[2].map(s=>`<span class="tag">${s}</span>`).join("")}<div class="mu">${LV[p[3]]} · ${p[4]}</div>${bar(pp(i))}<div class="mu">${pp(i)}% complete</div></div>`).join("")}</div>`},
studio(){return `<h1>Content Studio</h1><p class="sub">Draft lessons, scripts and quizzes. Output is simulated in this prototype.</p><div class="g g2"><div class="card f"><h2>Brief</h2>${sel("Subject",["Artificial Intelligence","Business","Science","Mathematics","History","Robotics"],"s1")}${sel("Target audience",["Beginner learners","Teenagers","University students","Professionals"],"s2")}${sel("Education level",["Primary","Secondary","Higher education"],"s3")}${sel("Language",["English","Spanish","French","Arabic"],"s4")}${sel("Content format",["Educational lesson","Video script","Podcast script","Presentation outline","Quiz","Practical assignment","Project guide","Educational article"],"s5")}${sel("Difficulty",LV,"s6")}<label>Learning objective</label><input id="s7" value="Explain the idea with one everyday example"><label>Topic</label><input id="s8" value="What is Artificial Intelligence?"><button class="btn" style="margin-top:14px" onclick="gen()">Generate content</button></div>
<div class="card f"><div class="row sp"><h2>Draft</h2><span class="tag" id="cs">Not generated</span></div><textarea class="ed" id="ed" placeholder="Generated content appears here. You can edit it."></textarea><div class="row wrap" style="margin-top:10px"><button class="btn s" onclick="pv()">Preview</button><button class="btn s" onclick="sv('Draft')">Save draft</button><button class="btn" onclick="sv('Published')">Publish</button></div><div id="pvw" class="mu" style="margin-top:10px"></div></div></div>
<div class="card sec"><h2>Content library</h2>${["All","Draft","Published"].map(f=>`<button class="tab ${f==LF?"on":""}" onclick="LF='${f}';render()">${f}</button>`).join("")}${S.lib.filter(x=>LF=="All"||x.st==LF).map(x=>`<div class="row sp" style="padding:8px 0;border-top:1px solid var(--b)"><div><b>${esc(x.t)}</b><div class="mu">${x.f}</div></div><div class="row"><span class="tag">${x.st}</span><button class="btn s sm" onclick="ld(${x.id})">Edit</button></div></div>`).join("")}</div>`},
podcast(){return `<h1>AI Podcast Studio</h1><div class="note">Frontend simulation. No live audio or real multi-model conversation is connected.</div><div class="g g5">${PA.map((a,i)=>`<div class="spk" id="sp${i}"><b>${a[0]}</b><div class="mu">${a[1]}</div><p class="mu" style="margin:6px 0">${a[2]}</p><span class="tag">♪ voice (simulated)</span></div>`).join("")}</div>
<div class="g g2 sec"><div class="card f"><h2>Host controls</h2><label>Topic</label><input id="pt" value="How will artificial intelligence change education in the next ten years?"><label>Style</label><select><option>Friendly debate</option><option>Deep dive</option><option>Interview</option></select><label>Duration</label><select><option>10 min</option><option>20 min</option></select><div class="row" style="margin-top:12px"><button class="btn" onclick="pstart()">Start discussion</button><button class="btn s" onclick="ppause()" id="pb">Pause</button><button class="btn s" onclick="pstop()">Stop</button></div><label>Add a question as host</label><div class="row"><input id="hq" placeholder="e.g. What about students without internet?"><button class="btn s" onclick="hostq()">Ask</button></div></div>
<div class="card"><h2>Transcript</h2><div class="tr" id="tr"><p class="mu">Press Start discussion.</p></div></div></div><div class="card sec" id="sum"><h2>Summary and key takeaways</h2><p class="mu">Appears when the discussion ends.</p></div>`},
progress(){const sub=[["Technology",82],["Business",74],["Science",61],["Mathematics",55],["History",68],["Communication",77]];
return `<h1>My Progress</h1><p class="sub">Sample analytics for demonstration. These are not validated measures of ability or predictions of outcomes.</p><div class="g g2"><div class="card"><h2>Subject performance</h2>${sub.map(s=>`<div class="row sp mu"><span>${s[0]}</span><span>${s[1]}%</span></div>${bar(s[1])}`).join("")}</div>
<div class="card"><h2>Learning consistency (last 5 weeks)</h2><svg viewBox="0 0 300 120" width="100%"><polyline fill="none" stroke="#22d3ee" stroke-width="3" points="10,90 80,60 150,75 220,35 290,20"/>${[[10,90],[80,60],[150,75],[220,35],[290,20]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#3b82f6"/>`).join("")}</svg><div class="mu">4 of 5 active days per week on average</div></div></div>
<div class="g g2 sec"><div class="card"><h2>Strengths</h2><span class="tag">Problem framing</span><span class="tag">Python basics</span><span class="tag">Business reasoning</span><h2 style="margin-top:14px">To improve</h2><span class="tag">Proof writing</span><span class="tag">Statistics</span><h2 style="margin-top:14px">Assessments</h2><div class="mu">AI Foundations Quiz — 88%<br>Python Checkpoint — 76%<br>Startup Case Review — 91%</div></div>
<div class="card"><h2>Development timeline</h2><div class="tl"><div><b>Month 1</b> Introduction to AI</div><div><b>Month 2</b> Python fundamentals</div><div><b>Month 3</b> First AI project</div><div><b>Month 4</b> Business problem-solving</div></div></div></div>
